name: CI

on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md"]
  pull_request:

permissions:
  contents: write

env:
  NX_NO_CLOUD: "true"
  NX_DAEMON: "false"
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_SERVER_URI: "http://localhost:8080"

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund 2>&1 | tee -a ci.log

      - name: Generate Prisma client
        run: npx prisma generate 2>&1 | tee -a ci.log

      - name: Typecheck backend
        run: |
          set -o pipefail
          echo "=== typecheck backend" >> ci.log
          npx tsc -p tsconfig.check.json --pretty false 2>&1 | tee -a ci.log

      - name: Typecheck frontends
        if: always()
        run: |
          set -o pipefail
          status=0
          for app in user-ui seller-ui admin-ui; do
            echo "=== typecheck $app" >> ci.log
            npx tsc -p apps/$app/tsconfig.json --noEmit --pretty false 2>&1 | tee -a ci.log || status=1
          done
          exit $status

      - name: Build backend services
        if: always()
        run: |
          set -o pipefail
          echo "=== build backend" >> ci.log
          npx nx run-many -t build --projects=api-gateway,auth-service,catalog-service,booking-service,admin-service --outputStyle=static 2>&1 | tee -a ci.log

      - name: Build frontends
        if: always()
        run: |
          set -o pipefail
          echo "=== build frontends" >> ci.log
          npx nx run-many -t build --projects=user-ui,seller-ui,admin-ui --parallel=1 --outputStyle=static 2>&1 | tee -a ci.log

      - name: Start MongoDB (replica set) for the smoke test
        if: always()
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval "db.runCommand({ping:1})" >/dev/null 2>&1 && break; sleep 2; done
          docker exec mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          sleep 5

      - name: End-to-end smoke test
        if: always()
        env:
          DATABASE_URL: "mongodb://localhost:27017/huza_ci?replicaSet=rs0&directConnection=true"
          REDIS_DATABASE_URI: "redis://localhost:6379"
          ACCESS_TOKEN_SECRET: "ci-access-secret"
          REFRESH_TOKEN_SECRET: "ci-refresh-secret"
          PAYOUTS_ANY_DAY: "true"
          DISABLE_JOBS: "true"
          SMOKE_ACCOUNTS_FILE: /tmp/accounts.json
        run: |
          set -o pipefail
          echo "=== smoke test" >> ci.log
          npx prisma db push --skip-generate 2>&1 | tee -a ci.log
          for svc in auth-service catalog-service booking-service admin-service api-gateway; do
            node apps/$svc/dist/main.js > /tmp/$svc.log 2>&1 &
          done
          for port in 6001 6002 6003 6004 8080; do
            for i in $(seq 1 30); do curl -s localhost:$port >/dev/null && break; sleep 1; done
          done
          node scripts/smoke-test.js 2>&1 | tee -a ci.log || status=$?
          for svc in auth-service catalog-service booking-service admin-service api-gateway; do
            echo "=== $svc log" >> ci.log; tail -n 80 /tmp/$svc.log >> ci.log
          done
          exit ${status:-0}

      - name: Screenshots of the websites
        if: always()
        env:
          SMOKE_ACCOUNTS_FILE: /tmp/accounts.json
        run: |
          echo "=== screenshots" >> ci.log
          npm install --no-save --no-audit --no-fund playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          (cd apps/user-ui && npx next start -p 3000 > /tmp/user-ui.log 2>&1 &)
          (cd apps/seller-ui && npx next start -p 3001 > /tmp/seller-ui.log 2>&1 &)
          (cd apps/admin-ui && npx next start -p 3002 > /tmp/admin-ui.log 2>&1 &)
          for port in 3000 3001 3002; do for i in $(seq 1 40); do curl -s localhost:$port >/dev/null && break; sleep 1; done; done
          node scripts/ci/screenshots.js 2>&1 | tee -a ci.log || true

      # Keeps the full log on a separate branch so it can be read without the Actions UI
      - name: Publish log
        if: always() && github.event_name == 'push'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir /tmp/logrepo && cp ci.log /tmp/logrepo/latest.log && (cp -r shots /tmp/logrepo/ 2>/dev/null || true) && cd /tmp/logrepo
          echo "${GITHUB_SHA}" > latest-sha.txt
          git init -q -b ci-logs
          git config user.name "huza-ci"
          git config user.email "ci@users.noreply.github.com"
          git add . && git commit -qm "CI log for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs
